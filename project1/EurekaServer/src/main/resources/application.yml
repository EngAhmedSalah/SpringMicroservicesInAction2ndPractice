spring:
  application:
    name: EurekaServer
server:
  port: 8761

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false



#1️⃣ eureka.instance.hostname: localhost
#  This sets the hostname of the Eureka instance to localhost.
#  If this is a standalone setup (not a cluster), localhost is fine.
#  In a distributed system, you'd typically set this to an actual domain or IP.
#2️⃣ eureka.client.register-with-eureka: false
#  This prevents the Eureka Server from registering itself in the registry.
#  A Eureka client (e.g., a microservice) would register itself, but the Eureka Server doesn’t need to register with itself.
#3️⃣ eureka.client.fetch-registry: false
#  This prevents the Eureka Server from trying to fetch registry information from other Eureka instances.
#  Since this is a standalone Eureka Server, there are no other servers to fetch from.
